# Watchlist of employers.
#
# ats: workday | greenhouse | lever | smartrecruiters | manual
#   workday          -> tenant, dc, site. Read them off the careers URL:
#                       https://<tenant>.<dc>.myworkdayjobs.com/en-US/<site>
#   greenhouse       -> token            (add eu: true for job-boards.eu.greenhouse.io)
#   lever            -> token            (add eu: true for jobs.eu.lever.co)
#   smartrecruiters  -> token            (company identifier in the jobs URL)
#   manual           -> url only. Shown on the dashboard as a "check site" link.
#
# To convert a manual entry, run the "Discover ATS" workflow (Actions tab) with
# the company's careers URL and paste the snippet it prints.
#
# sector: trader | major | utility

companies:
  # Verified Workday endpoints
  - name: Shell
    sector: major
    ats: workday
    tenant: shell
    dc: wd3
    site: ShellCareers

  - name: bp
    sector: major
    ats: workday
    tenant: bpinternational
    dc: wd3
    site: bpCareers

  - name: Equinor
    sector: major
