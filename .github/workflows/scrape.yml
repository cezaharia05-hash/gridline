name: Scrape roles

on:
  schedule:
    - cron: "15 5 * * *"   # every day, 05:15 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run filter tests
        run: python -m pytest -q

      - name: Scrape
        run: python -m scraper.run

      - name: Commit updated data
        run: |
          if git diff --quiet -- docs/data/jobs.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "gridline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json
          git commit -m "Update roles $(date -u +%Y-%m-%d)"
          git push
